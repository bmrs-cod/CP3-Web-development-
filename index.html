<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogos Favoritos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login">
        <h2>Login</h2>

        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">

        <button onclick="fazerLogin()">
            Entrar
        </button>

        <p id="erroLogin"></p>
    </div>

    <div id="crud" style="display:none;">

        <h2>Meus Jogos Favoritos</h2>

        <input
            type="text"
            id="novoItem"
            placeholder="Novo jogo">

        <button onclick="adicionarFinal()">
            Adicionar Final
        </button>

        <button onclick="adicionarInicio()">
            Adicionar Início
        </button>

        <p id="erroItem"></p>

        <ul id="lista"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
